name: MalodyLink
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
packages:
  MalodyCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MalodyLink:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Resources
        buildPhase: resources
        excludes: [.gitkeep]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Malody Link
        CFBundleShortVersionString: '0.3.0'
        CFBundleVersion: '4'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: 将你生成的 B30 成绩图保存到照片。
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Malody chart package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [cn.gmiya.malodylink.mcz, cn.gmiya.malodylink.mcb, public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: cn.gmiya.malodylink.mcz
            UTTypeDescription: Malody chart package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [mcz]
          - UTTypeIdentifier: cn.gmiya.malodylink.mcb
            UTTypeDescription: Malody batch package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [mcb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gmiya.malodylink.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MalodyCore
      - sdk: libsqlite3.tbd
  MalodyLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gmiya.malodylink.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MalodyLink
    dependencies:
      - target: MalodyLink
schemes:
  MalodyLink:
    build:
      targets:
        MalodyLink: all
    test:
      targets: [MalodyLinkUITests]
